<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chess League - Fixtures</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        background-color: #fcebb6;
        font-family: "Courier New", Courier, monospace;
      }
      h1,
      h2 {
        font-family: "Press Start 2P", cursive;
      }
      table {
        border-collapse: separate;
        border-spacing: 0;
      }
      th,
      td {
        border: 2px solid #000;
      }
      .nav-link {
        background: #000;
        color: #fff;
        padding: 0.5rem 1rem;
        border-radius: 5px;
        text-decoration: none;
      }
      .nav-link:hover {
        background: #333;
      }
    </style>
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="text-gray-900">
    <div class="max-w-6xl mx-auto p-4">
      <h1 class="text-3xl text-center mb-8">Chess League Fixtures</h1>

      <!-- Navigation -->
      <nav class="flex justify-center space-x-4 mb-10">
        <a href="index.html" class="nav-link">Home</a>
        <a href="fixtures.html" class="nav-link">Fixtures</a>
        <a href="standings.html" class="nav-link">Standings</a>
      </nav>

      <section>
        <h2 class="text-xl mb-4 text-center">Upcoming & Past Matches</h2>
        <div class="overflow-x-auto">
          <table class="w-full bg-yellow-50 text-sm">
            <thead class="bg-yellow-200">
              <tr>
                <th class="py-2 px-2 text-left">Match</th>
                <th class="py-2 px-2 text-left">Player A</th>
                <th class="py-2 px-2 text-left">Player B</th>
                <th class="py-2 px-2 text-left">Date</th>
                <th class="py-2 px-2 text-left">Result</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td class="py-2 px-2">1</td>
                <td class="py-2 px-2">Alice</td>
                <td class="py-2 px-2">Bob</td>
                <td class="py-2 px-2">2025-05-03</td>
                <td class="py-2 px-2">1-0</td>
              </tr>
              <tr>
                <td class="py-2 px-2">2</td>
                <td class="py-2 px-2">Charlie</td>
                <td class="py-2 px-2">Diana</td>
                <td class="py-2 px-2">2025-05-04</td>
                <td class="py-2 px-2">-</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </div>
  </body>
</html>
